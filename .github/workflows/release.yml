name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  KEEPASS_VERSION: '2.61'

permissions:
  contents: write

jobs:
  build:
    runs-on: 'windows-2022'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download KeePass
        run: curl.exe -fsSL -o KeePass.zip "https://sourceforge.net/projects/keepass/files/KeePass%202.x/${{ env.KEEPASS_VERSION }}/KeePass-${{ env.KEEPASS_VERSION }}.zip/download"
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Extract KeePass and Build
        run: |
          mkdir build
          7z x -o"build" KeePass.zip KeePass.exe
          $ainfo = "KeePassNatMsg\Properties\AssemblyInfo.cs"
          $content = (Get-Content -Path $ainfo) -replace '\[assembly: AssemblyVersion\("([\d.]+?)"\)\]', ('[assembly: AssemblyVersion("' + "${{ github.ref_name }}".substring(1).Split('-')[0] + '")]')
          $content | Set-Content -Path $ainfo
          msbuild /p:Configuration=Release
      - name: Prepare Release
        run: |
          cp -Recurse KeePassNatMsg\bin\Release\ build\
          mv build\Release build\KeePassNatMsg
          $zip = 'KeePassNatMsg-${{ github.ref_name }}-binaries.zip'
          7z a $zip .\build\KeePassNatMsg\ "-xr!*.pdb"
          $hash = (Get-FileHash "$zip" sha256).Hash.ToLower()
          Set-Content -Path 'release.txt' -Value ('### SHA256 Hash',('* '+$zip),('  * '+$hash))
          git clean -fx -e keepassnatmsg-proxy.exe KeePassNatMsg
          $p = Start-Process -FilePath ".\build\KeePass.exe" -ArgumentList "--plgx-create","$pwd\KeePassNatMsg" -PassThru
          $p.WaitForExit()
          $plgx = 'KeePassNatMsg.plgx'
          $hash = (Get-FileHash "$plgx" sha256).Hash.ToLower()
          Add-Content -Path 'release.txt' -Value (('* '+$plgx),('  * '+$hash))
      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            KeePassNatMsg-${{ github.ref_name }}-binaries.zip
            KeePassNatMsg.plgx
